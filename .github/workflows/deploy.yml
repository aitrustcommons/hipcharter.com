# hipcharter.com now forwards to aitrustcommons.org (Nov 2026, AITC task #625).
# This publishes the forwards/ folder to GitHub Pages on every push to main.
# The old MkDocs site stays on the gh-pages branch for rollback: switch the
# Pages source back to "Deploy from a branch: gh-pages" (see README).
name: Deploy forwards to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Upload the forwards
        uses: actions/upload-pages-artifact@v5
        with:
          path: forwards
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
